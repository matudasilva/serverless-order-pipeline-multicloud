<svg width="1100" height="500" viewBox="0 0 1100 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AWS baseline structural architecture</title>
<desc>Product structural diagram. The implemented AWS baseline accepts orders through API Gateway, decouples processing with SQS and a DLQ, persists orders in DynamoDB, then sends a post-persistence notification through DynamoDB Streams, Lambda and SNS. GCP and Azure are future provider variants.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1100" height="500" fill="#FBFAF7"/>
<text x="550" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#26215C">AWS baseline — structural architecture</text>
<text x="550" y="58" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Implemented provider baseline; GCP and Azure follow the same responsibilities with native services.</text>
<rect x="26" y="130" width="130" height="70" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/><text x="91" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Client</text><text x="91" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">POST /orders</text>
<rect x="205" y="130" width="150" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7"/><text x="280" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#26215C">API Gateway</text><text x="280" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3C3489">HTTP ingress</text>
<rect x="405" y="130" width="150" height="70" rx="10" fill="#FAECE7" stroke="#993C1D"/><text x="480" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">SQS</text><text x="480" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#712B13">orders queue</text>
<rect x="405" y="280" width="150" height="60" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-dasharray="4 3"/><text x="480" y="307" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#4A1B0C">SQS DLQ</text><text x="480" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#712B13">failed delivery</text>
<rect x="605" y="130" width="150" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56"/><text x="680" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#04342C">Lambda 1</text><text x="680" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#085041">process order</text>
<rect x="805" y="130" width="150" height="70" rx="10" fill="#EAF3DE" stroke="#3B6D11"/><text x="880" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#173404">DynamoDB</text><text x="880" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#27500A">orders + stream</text>
<rect x="805" y="280" width="150" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56"/><text x="880" y="307" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#04342C">Lambda 2</text><text x="880" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#085041">publish notification</text>
<rect x="985" y="280" width="90" height="60" rx="10" fill="#EEEDFE" stroke="#534AB7"/><text x="1030" y="307" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#26215C">SNS</text><text x="1030" y="325" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3C3489">email</text>
<line x1="156" y1="165" x2="201" y2="165" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="355" y1="165" x2="401" y2="165" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="555" y1="165" x2="601" y2="165" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="755" y1="165" x2="801" y2="165" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480 202V276" fill="none" stroke="#993C1D" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="492" y="246" font-family="sans-serif" font-size="10" fill="#712B13">after retries</text><path d="M880 202V276" fill="none" stroke="#0F6E56" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="892" y="246" font-family="sans-serif" font-size="10" fill="#085041">INSERT stream</text><line x1="955" y1="310" x2="981" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="550" y="450" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8A8880">Constitution structural view — provider-specific implementation details are documented under providers/aws/.</text>
</svg>
