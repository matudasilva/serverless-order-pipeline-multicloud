name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "providers/aws/**"
      - "providers/gcp/**"
      - "providers/azure/**"
      - "docs/contracts/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "providers/aws/**"
      - "providers/gcp/**"
      - "providers/azure/**"
      - "docs/contracts/**"
      - ".github/workflows/terraform.yml"

jobs:
  aws-fmt-and-validate:
    name: AWS fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: providers/aws/envs/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, no credentials needed)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  gcp-fmt-and-validate:
    name: GCP ${{ matrix.stack }} fmt + validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, workload]
    defaults:
      run:
        working-directory: providers/gcp/envs/dev/${{ matrix.stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        run: terraform fmt -check

      - name: terraform init (no backend, no credentials needed)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  contract-runner-tests:
    name: Contract runner tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run conformance runner tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/conformance/requirements.txt
          python -m pytest tests/conformance/tests

  azure-fmt-validate-and-test:
    name: Azure fmt + validate + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check
        run: terraform -chdir=providers/azure/envs/dev fmt -check

      - name: terraform init (no backend, no credentials needed)
        run: terraform -chdir=providers/azure/envs/dev init -backend=false

      - name: terraform validate
        run: terraform -chdir=providers/azure/envs/dev validate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Azure tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r providers/azure/tests/requirements.txt
          python -m pytest providers/azure/tests
