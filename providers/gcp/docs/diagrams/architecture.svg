<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>GCP order pipeline architecture — validated implementation</title><desc>Validated GCP implementation. Client calls public Cloud Run ingress, which publishes to Pub/Sub. A private processor persists Firestore orders; Eventarc invokes a private notifier, which publishes the notification topic. The processor subscription uses a DLQ.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs><rect width="1200" height="500" fill="#FBFAF7"/>
<text x="600" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#26215C">GCP order pipeline — validated implementation</text><text x="600" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Manual deployment and end-to-end validation complete</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="25" y="165" width="115" height="65" rx="9" fill="#F1EFE8" stroke="#5F5E5A"/><text x="82" y="193" font-size="14" fill="#2C2C2A">Client</text><text x="82" y="211" font-size="10" fill="#5F5E5A">POST /orders</text><rect x="185" y="165" width="145" height="65" rx="9" fill="#E1F5EE" stroke="#0F6E56"/><text x="257" y="193" font-size="14" fill="#04342C">Cloud Run</text><text x="257" y="211" font-size="10" fill="#085041">public ingress</text><rect x="380" y="165" width="135" height="65" rx="9" fill="#FAECE7" stroke="#993C1D"/><text x="447" y="193" font-size="14" fill="#4A1B0C">Pub/Sub</text><text x="447" y="211" font-size="10" fill="#712B13">orders topic</text><rect x="575" y="165" width="145" height="65" rx="9" fill="#E1F5EE" stroke="#0F6E56"/><text x="647" y="193" font-size="14" fill="#04342C">Cloud Run</text><text x="647" y="211" font-size="10" fill="#085041">private processor</text><rect x="770" y="165" width="135" height="65" rx="9" fill="#EAF3DE" stroke="#3B6D11"/><text x="837" y="193" font-size="14" fill="#173404">Firestore</text><text x="837" y="211" font-size="10" fill="#27500A">orders collection</text><rect x="770" y="310" width="135" height="55" rx="9" fill="#EEEDFE" stroke="#534AB7"/><text x="837" y="334" font-size="13" fill="#26215C">Eventarc</text><text x="837" y="351" font-size="10" fill="#3C3489">created event</text><rect x="960" y="310" width="145" height="55" rx="9" fill="#E1F5EE" stroke="#0F6E56"/><text x="1032" y="334" font-size="13" fill="#04342C">Cloud Run</text><text x="1032" y="351" font-size="10" fill="#085041">private notifier</text><rect x="1050" y="165" width="125" height="65" rx="9" fill="#FAECE7" stroke="#993C1D"/><text x="1112" y="193" font-size="14" fill="#4A1B0C">Pub/Sub</text><text x="1112" y="211" font-size="10" fill="#712B13">notification test</text><rect x="380" y="310" width="135" height="55" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-dasharray="4 3"/><text x="447" y="334" font-size="13" fill="#4A1B0C">Pub/Sub DLQ</text><text x="447" y="351" font-size="10" fill="#712B13">inspection pull</text></g>
<g stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#a)"><line x1="140" y1="198" x2="181" y2="198"/><line x1="330" y1="198" x2="376" y2="198"/><line x1="515" y1="198" x2="571" y2="198" stroke-dasharray="4 3"/><line x1="720" y1="198" x2="766" y2="198"/><path d="M837 232V306" stroke-dasharray="4 3"/><line x1="905" y1="337" x2="956" y2="337"/><path d="M1032 310V235H1050" stroke-dasharray="4 3"/><path d="M447 232V306" stroke="#993C1D" stroke-dasharray="4 3"/></g>
<text x="600" y="450" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8A8880">Location: us-central1. The push subscription has retry and DLQ policy; Eventarc/Pub/Sub delivery is at least once.</text>
</svg>
