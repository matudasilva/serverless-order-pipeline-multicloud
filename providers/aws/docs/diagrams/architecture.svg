<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AWS order pipeline architecture — validated baseline</title><desc>Validated AWS baseline. Client calls API Gateway, which sends the order directly to SQS. Lambda 1 persists orders in DynamoDB; a DynamoDB Streams event invokes Lambda 2, which publishes a notification to SNS and email. The SQS subscription uses a dead-letter queue.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs><rect width="1200" height="500" fill="#FBFAF7"/>
<text x="600" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#26215C">AWS order pipeline — validated baseline</text><text x="600" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">AWS implementation reference for the multicloud comparison</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="25" y="165" width="115" height="65" rx="9" fill="#F1EFE8" stroke="#5F5E5A"/><text x="82" y="193" font-size="14" fill="#2C2C2A">Client</text><text x="82" y="211" font-size="10" fill="#5F5E5A">POST /orders</text><rect x="175" y="165" width="145" height="65" rx="9" fill="#EAF3DE" stroke="#3B6D11"/><text x="247" y="193" font-size="14" fill="#173404">API Gateway</text><text x="247" y="211" font-size="10" fill="#27500A">direct SQS integration</text><rect x="355" y="165" width="135" height="65" rx="9" fill="#FAECE7" stroke="#993C1D"/><text x="422" y="193" font-size="14" fill="#4A1B0C">SQS</text><text x="422" y="211" font-size="10" fill="#712B13">POC-Queue</text><rect x="525" y="165" width="145" height="65" rx="9" fill="#E1F5EE" stroke="#0F6E56"/><text x="597" y="193" font-size="14" fill="#04342C">Lambda 1</text><text x="597" y="211" font-size="10" fill="#085041">order processor</text><rect x="705" y="165" width="145" height="65" rx="9" fill="#EAF3DE" stroke="#3B6D11"/><text x="777" y="193" font-size="14" fill="#173404">DynamoDB</text><text x="777" y="211" font-size="10" fill="#27500A">orders table</text><rect x="900" y="165" width="135" height="65" rx="9" fill="#EEEDFE" stroke="#534AB7"/><text x="967" y="193" font-size="14" fill="#26215C">Streams</text><text x="967" y="211" font-size="10" fill="#3C3489">NEW_IMAGE</text><rect x="900" y="310" width="135" height="55" rx="9" fill="#E1F5EE" stroke="#0F6E56"/><text x="967" y="334" font-size="13" fill="#04342C">Lambda 2</text><text x="967" y="351" font-size="10" fill="#085041">notification</text><rect x="1060" y="310" width="100" height="55" rx="9" fill="#FAECE7" stroke="#993C1D"/><text x="1110" y="334" font-size="13" fill="#4A1B0C">SNS</text><text x="1110" y="351" font-size="10" fill="#712B13">POC-Topic</text><rect x="355" y="310" width="135" height="55" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-dasharray="4 3"/><text x="422" y="334" font-size="13" fill="#4A1B0C">SQS DLQ</text><text x="422" y="351" font-size="10" fill="#712B13">failed messages</text><rect x="1060" y="165" width="100" height="55" rx="9" fill="#F1EFE8" stroke="#5F5E5A"/><text x="1110" y="189" font-size="13" fill="#2C2C2A">Email</text><text x="1110" y="207" font-size="10" fill="#5F5E5A">subscription</text></g>
<g stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#a)"><line x1="140" y1="198" x2="171" y2="198"/><line x1="320" y1="198" x2="351" y2="198"/><line x1="490" y1="198" x2="521" y2="198" stroke-dasharray="4 3"/><line x1="670" y1="198" x2="701" y2="198"/><line x1="850" y1="198" x2="896" y2="198" stroke-dasharray="4 3"/><path d="M967 232V306" stroke-dasharray="4 3"/><line x1="1035" y1="337" x2="1056" y2="337"/><path d="M1110 310V235" stroke-dasharray="4 3"/><path d="M422 232V306" stroke="#993C1D" stroke-dasharray="4 3"/></g>
<text x="600" y="450" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8A8880">Location: us-east-1. SQS uses retry and DLQ policy; Streams and Lambda delivery are asynchronous and at least once.</text>
</svg>
